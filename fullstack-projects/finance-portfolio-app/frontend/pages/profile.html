<!DOCTYPE html>
<!--

  © 2024 G7 Finance. All rights reserved.

<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Profile - G7 Finance</title>
		<link
			rel="stylesheet"
			href="styles.css" />

		<style>
			html,
			body {
				height: 100%;
				min-height: 100vh;
				margin: 0;
				padding: 0;
			}
			body {
				background-color: var(--bg-secondary) !important;
				display: flex;
				flex-direction: column;
			}
			main {
				flex: 1;
			}
		</style>

		<script>
			(function () {
				const theme = localStorage.getItem('theme') || 'light';
				document.documentElement.setAttribute('data-theme', theme);
			})();
		</script>
	</head>
	<body>
		<script>
			// Block access if not logged in
			if (!localStorage.getItem('user_id')) {
				window.location.href = 'login.html';
			}
		</script>
		<nav class="navbar">
			<div class="nav-container">
				<div class="logo">G7 Finance</div>
				<div class="nav-links">
					<a href="dashboard.html">Dashboard</a>
					<a href="portfolio.html">Portfolio</a>
					<a href="favorites.html">Favorites</a>
					<a
						href="profile.html"
						class="active"
						>Profile</a
					>
					<button class="theme-toggle">
						<span class="theme-icon">🌙</span>
					</button>
					<button
						onclick="handleLogout()"
						class="btn btn-secondary">
						Logout
					</button>
				</div>
			</div>
		</nav>

		<main style="padding: 40px; max-width: 900px; margin: 0 auto">
			<!-- Profile Header -->
			<div
				style="
					background: var(--card-bg);
					padding: 50px;
					border-radius: 16px;
					box-shadow: var(--shadow-md);
					text-align: center;
					margin-bottom: 30px;
				">
				<div
					style="
						width: 120px;
						height: 120px;
						border-radius: 50%;
						background: linear-gradient(
							135deg,
							var(--primary-color),
							var(--primary-dark)
						);
						margin: 0 auto 20px;
						display: flex;
						align-items: center;
						justify-content: center;
						font-size: 3rem;
						color: white;
						font-weight: bold;
						box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
					"
					id="user-avatar">
					?
				</div>
				<h1
					id="user-name-header"
					style="
						margin: 0 0 10px 0;
						color: var(--text-primary);
						font-size: 2rem;
					">
					Loading...
				</h1>
				<p
					id="user-email-header"
					style="color: var(--text-secondary); font-size: 1.1rem; margin: 0">
					Loading...
				</p>
			</div>

			<!-- Account Information -->
			<div
				style="
					background: var(--card-bg);
					padding: 30px;
					border-radius: 12px;
					box-shadow: var(--shadow-md);
					margin-bottom: 30px;
					max-width: 400px;
					margin-left: auto;
					margin-right: auto;
				">
				<div
					style="
						color: var(--text-secondary);
						font-size: 0.85rem;
						text-transform: uppercase;
						letter-spacing: 1px;
						margin-bottom: 10px;
					">
					Member Since
				</div>
				<div
					id="user-joined"
					style="
						color: var(--text-primary);
						font-size: 1.2rem;
						font-weight: 500;
					">
					Loading...
				</div>
			</div>

			<!-- Back Button -->
			<div style="text-align: center">
				<a
					href="dashboard.html"
					class="btn btn-primary"
					style="
						display: inline-block;
						padding: 14px 40px;
						text-decoration: none;
						font-size: 1rem;
					">
					Back to Dashboard
				</a>
			</div>
		</main>

		<script src="../scripts/dark-mode.js"></script>
		<script>
			// Load user data
			const userId = localStorage.getItem('user_id');
			const userName = localStorage.getItem('user_name');
			const userEmail = localStorage.getItem('user_email');

			console.log('Profile page loaded for user:', {
				userId,
				userName,
				userEmail,
			});

			// Helper function to get initials
			function getInitials(name) {
				if (!name) return '?';
				const parts = name.trim().split(' ');
				if (parts.length === 1) return parts[0][0].toUpperCase();
				return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
			}

			// Display basic info from localStorage
			if (userName) {
				document.getElementById('user-name-header').textContent = userName;
				document.getElementById('user-avatar').textContent =
					getInitials(userName);
			}
			if (userEmail) {
				document.getElementById('user-email-header').textContent = userEmail;
			}

			// Fetch full user data from API
			if (userId) {
				fetch(`/api/users/${userId}`)
					.then((r) => r.json())
					.then((data) => {
						console.log('User data from API:', data);
						if (data.success) {
							const user = data.data;

							// Update display
							document.getElementById('user-name-header').textContent =
								user.name || 'N/A';
							document.getElementById('user-email-header').textContent =
								user.email || 'N/A';
							document.getElementById('user-avatar').textContent = getInitials(
								user.name
							);

							// Format and display creation date
							if (user.creation_time) {
								const date = new Date(user.creation_time);
								document.getElementById('user-joined').textContent =
									date.toLocaleDateString('en-US', {
										year: 'numeric',
										month: 'long',
										day: 'numeric',
									});
							} else {
								document.getElementById('user-joined').textContent = 'N/A';
							}
						}
					})
					.catch((err) => {
						console.error('Error fetching user data:', err);
						document.getElementById('user-name-header').textContent =
							'Error loading data';
					});
			} else {
				document.getElementById('user-name-header').textContent =
					'Not logged in';
				document.getElementById('user-email-header').textContent =
					'Please log in';
				document.getElementById('user-joined').textContent = 'N/A';
			}

			// Logout function
			function handleLogout() {
				console.log('Logging out...');
				localStorage.removeItem('user_id');
				localStorage.removeItem('user_name');
				localStorage.removeItem('user_email');
				alert('Logged out successfully!');
				window.location.href = 'login.html';
			}

			console.log('✓ Profile script loaded');
		</script>
	</body>
</html>
